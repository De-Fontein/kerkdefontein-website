{{define "layout"}}<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Page.Title}}</title>
<meta name="description" content="{{.Page.Description}}">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{.Data.BaseURL}}{{.Page.Path}}">
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/site.css?v={{.CSSVersion}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="nl_NL">
<meta property="og:site_name" content="Baptistengemeente De Fontein">
<meta property="og:title" content="{{.Page.Title}}">
<meta property="og:description" content="{{.Page.Description}}">
<meta property="og:url" content="{{.Data.BaseURL}}{{.Page.Path}}">
<meta property="og:image" content="{{.Data.BaseURL}}/static/img/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{{.JSONLD}}</script>
</head>
<body>
<a class="skip-link" href="#main">Naar de inhoud</a>
{{template "header" .}}
<main id="main">{{template "main" .}}</main>
{{template "footer" .}}
{{if eq .Page.Path "/"}}<script type="module" src="/static/js/youtube.js"></script>{{end}}
</body>
</html>{{end}}
