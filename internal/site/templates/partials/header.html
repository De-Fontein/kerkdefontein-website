{{define "header"}}<header class="site-header">
  <a class="brand" href="/"><img src="/static/img/logo.svg" alt="" width="36" height="36"><span>De Fontein</span></a>
  <button type="button" class="theme-toggle" data-theme-toggle data-state="auto" hidden aria-label="Thema: automatisch">
    <svg class="icon-auto" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg>
    <svg class="icon-light" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-dark" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z" fill="currentColor"/></svg>
  </button>
  <nav aria-label="Hoofdmenu">
    <button type="button" class="menu-toggle" popovertarget="menu">Menu</button>
    <ul id="menu" class="menu" popover>
      {{range .Nav}}<li><a href="{{.Path}}"{{if eq .Path $.Page.Path}} aria-current="page"{{end}}>{{.Label}}</a></li>
      {{end}}
    </ul>
  </nav>
</header>{{end}}
