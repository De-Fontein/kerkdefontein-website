{{define "header"}}<header class="site-header">
  <a class="brand" href="/"><img src="/static/img/logo.svg" alt="" width="36" height="36"><span>De Fontein</span></a>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></symbol>
    <symbol id="icon-light" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></symbol>
    <symbol id="icon-dark" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z" fill="currentColor"/></symbol>
    <mask id="oled-cutout"><rect width="24" height="24" fill="#fff"/><path d="M16.6 14.4A5 5 0 1 1 10.6 8a3.8 3.8 0 0 0 6 6.4z" fill="#000"/></mask>
    <symbol id="icon-oled" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="currentColor" mask="url(#oled-cutout)"/></symbol>
  </svg>
  <button type="button" class="theme-toggle" popovertarget="theme-menu" data-theme-toggle data-state="auto" hidden aria-label="Thema: automatisch">
    <svg class="icon-auto" aria-hidden="true" width="20" height="20"><use href="#icon-auto"/></svg>
    <svg class="icon-light" aria-hidden="true" width="20" height="20"><use href="#icon-light"/></svg>
    <svg class="icon-dark" aria-hidden="true" width="20" height="20"><use href="#icon-dark"/></svg>
    <svg class="icon-oled" aria-hidden="true" width="20" height="20"><use href="#icon-oled"/></svg>
  </button>
  <div id="theme-menu" class="theme-menu" popover>
    <fieldset>
      <legend>Thema</legend>
      <label><input type="radio" name="theme" value="auto" checked><svg aria-hidden="true" width="20" height="20"><use href="#icon-auto"/></svg>Automatisch</label>
      <label><input type="radio" name="theme" value="light"><svg aria-hidden="true" width="20" height="20"><use href="#icon-light"/></svg>Licht</label>
      <label><input type="radio" name="theme" value="dark"><svg aria-hidden="true" width="20" height="20"><use href="#icon-dark"/></svg>Donker</label>
      <label><input type="radio" name="theme" value="oled"><svg aria-hidden="true" width="20" height="20"><use href="#icon-oled"/></svg>OLED (zwart)</label>
    </fieldset>
  </div>
  <nav aria-label="Hoofdmenu">
    <button type="button" class="menu-toggle" popovertarget="menu">Menu</button>
    <ul id="menu" class="menu" popover>
      {{range .Nav}}<li><a href="{{.Path}}"{{if eq .Path $.Page.Path}} aria-current="page"{{end}}>{{.Label}}</a></li>
      {{end}}
    </ul>
  </nav>
</header>{{end}}
